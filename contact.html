<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
 
    <section>
        <nav>
            <ul class="navigation">
                <li id="navlist"><a href="./index.html"><h3><strong>Home</strong></h3></a></li>
                <li id="navlist"><a href="./contact.html"><h3>Contact Me</h3></a></li>
                <li id="navlist"><a href="./interests.html"><h3>My Interests</h3></a></li>
            </ul>
        </nav>
    </section>


    <header>
        <h1 class="center">Contact Me</h1>
    </header>

 
    <section class="form-section">
        <form action="#" method="POST">
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required placeholder="Enter your name">
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" placeholder="XXX-XXX-XXXX" required>
            </div>

            <div class="form-group">
                <label for="message">Message:</label>
                <textarea id="message" name="message"  placeholder="Your message" rows="4"></textarea>
            </div>

            <div class="form-group">
                <label>Type of Inquiry:</label>
                <input type="radio" id="question" name="inquiry" value="Question" required>
                <label for="question">Question</label>

                <input type="radio" id="comment" name="inquiry" value="Comment" required>
                <label for="comment">Comment</label>

                <input type="radio" id="suggestion" name="inquiry" value="Suggestion" required>
                <label for="suggestion">Suggestion</label>
            </div>

            <div class="form-group">
                <button type="submit">Submit</button>
            </div>
        </form>
    </section>

</body>
</html>
